<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A5F">
<title>客戶追蹤（自用）</title>
<!-- 自用入口：這頁不放任何客戶資料，只連到容瑜電腦上的追蹤網站（要 Tailscale＋登入密碼）。 -->
<style>
@font-face{font-family:"Huninn";src:url("../assets/fonts/huninn-subset.woff2") format("woff2");font-display:swap}
:root{--navy:#1F3A5F;--milk:#F5F0EB;--brick:#B85C38;--ink:#2D2D2D;--bg:#FAFAF8;--line:#E4DDD5;--muted:#6B6B6B}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.7 "Huninn",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
h1{margin:0 0 6px;color:var(--navy);font-size:30px;letter-spacing:.06em}
p{margin:0 0 20px;color:var(--muted);font-size:17px}
input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:20px;margin-bottom:12px;background:#fff}
input:focus{outline:none;border-color:var(--navy)}
.go{width:100%;border:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;min-height:60px;background:var(--brick);color:#fff;text-decoration:none;border-radius:14px;font-size:22px;letter-spacing:.06em}
a.alt{display:block;margin-top:12px;color:var(--navy);font-size:16px}
ul{text-align:left;color:var(--muted);font-size:15px;line-height:1.7;margin:22px 0 0;padding-left:1.2em}
</style>
</head>
<body>
<main>
  <h1>客戶追蹤</h1>
  <p>請輸入密碼</p>
  <form method="post" action="http://100.93.92.16:8778/login" autocomplete="off" id="f">
    <input type="password" name="pw" id="pw" placeholder="密碼" autocomplete="off" data-lpignore="true" autocapitalize="off" spellcheck="false" required autofocus>
    <button class="go" type="submit">進入追蹤系統</button>
  </form>
  <ul>
    <li>這台手機／電腦要先開啟 ＊＊＊</li>
    <li>金頭腦要思考，才不會固化</li>
    <li>無字天書，此網頁沒有任何足跡</li>
  </ul>
</main>
<script>
// 送出後清空欄位，不留下密碼
document.getElementById("f").addEventListener("submit", () => setTimeout(() => { document.getElementById("pw").value = ""; }, 0));
</script>
</body>
</html>
